<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudyBuddy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chela+One&display=swap" rel="stylesheet">

    <link rel="icon" href="favicon.ico">

    <meta name="description" content="This page displays all the information on all the students registered">
    <meta name="author" content="Tadiwanashe Dombe">
    
    <meta property="og:title" content="StudyBuddy">
    <meta property="og:description"
        content="This is page displays all the students in your class and their practical subjects">
    <meta property="og:image" content="https://tadiwanashedombe.github.io/wdd231/final/images/logo.webp">
    <meta property="og:url" content="https://tadiwanashedombe.github.io/wdd231/final/index.html">

    <link rel="stylesheet" href="styles/studybuddy.css">
    <link rel="stylesheet" href="styles/studybuddy-small.css">
    <script type="module" src="scripts/studybuddy.js"></script>
</head>

<body>
    <a href="everyone.html" id="link-to-everyone">
        <img src="images/everyone.svg" alt="everyone svg" width="20" height="20"> View all candidates
    </a>
    <header>
        <div class="logo">
            <img src="images/logo.webp" alt="study buddy logo" width="60" height="60">
            <span class="logo-text">StudyBuddy</span>
        </div>
        <span id="hello-name"></span>
    </header>
    <main>
        <div class="hero">
            <img src="images/hero.webp" alt="StudyBuddy Banner" width="1000" height="600" fetchpriority="high">
        </div>
        <section id="teachers">
            <h1>This Year's Candidates Teachers</h1>
                <div class="teachers-container">
                    <div class="teacher">
                        <img src="images/4a-teacher.webp" alt="mrs Chipetu profile" height="400" width="250"
                            loading="lazy">
                        <div class="teacher-details">
                            <p>Mrs Chipetu</p>
                            <p>4A</p>
                                <button id="teacher-4a" class="teacher-stats" data-teacher="Mrs Chipetu"
                                    data-class="4A">View Statistics</button>
                        </div>
                    </div>
                    <div class="teacher">
                        <img src="images/4b-teacher.webp" alt="mrs sloane profile" height="400" width="250"
                            loading="lazy">
                        <div class="teacher-details">
                            <p>Mrs Sloane</p>
                            <p>4B</p>
                            <button id="teacher-4b" class="teacher-stats" data-teacher="Mrs Sloane" data-class="4B">View
                                Statistics</button>
                        </div>
                    </div>
                    <div class="teacher">
                        <img src="images/4c-teacher.webp" alt="mr einstein profile" height="400" width="250"
                            loading="lazy">
                        <div class="teacher-details">
                            <p>Mr Einstein</p>
                            <p>4C</p>
                            <button class="teacher-stats" data-teacher="Mr Einstein" data-class="4C">View
                                Statistics</button>
                        </div>
                    </div>
                </div>
        </section>
        <section>
            <h2>Top students</h2>
            <div class="top-candidates">
                <div class="track  candidates"></div>
            </div>
        </section>
        <section>
            <h2>Your Class Mates</h2>
            <div class="class-mates candidates"></div>
        </section>
    </main>
    <footer>
        <span id="footer"></span>
    </footer>
</body>

</html>
