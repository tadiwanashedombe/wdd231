<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBuddy</title>

    <link rel="icon" href="favicon.ico">

     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chela+One&display=swap" rel="stylesheet">

    <meta name="description" content="This page displays all the information on all the students registered">
    <meta name="author" content="Tadiwanashe Dombe">


    <meta property="og:title" content="StudyBuddy">
    <meta property="og:description"
        content="This is page displays all the students in your class and their practical subjects">
    <meta property="og:image" content="https://tadiwanashedombe.github.io/wdd231/final/images/logo.webp">
    <meta property="og:url" content="https://tadiwanashedombe.github.io/wdd231/final/index.html">

    <link rel="stylesheet" href="styles/studybuddy.css">
    <link rel="stylesheet" href="styles/studybuddy-small.css">
    <script type="module" src="scripts/login.mjs"></script>
    <script type="module" src="scripts/footer.mjs"></script>

</head>

<body>
    <header>
        <div class="logo">
            <img src="images/logo.webp" alt="study buddy logo" width="60" width="60">
            <span class="logo-text">StudyBuddy</span>
        </div>
    </header>
    <main>
        <section class="form">
            <form id="loginForm">
                <h1>Enter Your Details</h1>
                <span>
                    <label for="name">Name :</label>
                    <input type="text" name="name" id="name" required placeholder="Tadiwanashe Dombe">
                </span>
                <span>
                    <label for="class">Class :</label>
                    <select name="class" id="class" required>
                        <option disabled selected>Please Select Your Class</option>
                        <option value="4A">4A</option>
                        <option value="4B">4B</option>
                        <option value="4C">4C</option>
                    </select>
                </span>
                <button type="submit" class="login-button">Login</button>
            </form>
        </section>
    </main>
    <footer>
        <span id="footer"></span>
    </footer>
</body>
</html>
